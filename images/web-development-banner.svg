<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Web development illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f0ff"/>
      <stop offset="0.55" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#3b82f6" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Decorative floating shapes -->
  <circle cx="150" cy="60" r="10" fill="#60a5fa" fill-opacity="0.5"/>
  <circle cx="1080" cy="70" r="14" fill="#a78bfa" fill-opacity="0.45"/>
  <circle cx="1010" cy="250" r="9" fill="#34d399" fill-opacity="0.55"/>
  <rect x="90" y="235" width="18" height="18" rx="4" fill="#fbbf24" fill-opacity="0.6" transform="rotate(20 99 244)"/>
  <path d="M1120 200 q20 -12 40 0" stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Browser window -->
  <g filter="url(#soft)">
    <rect x="150" y="55" width="560" height="205" rx="18" fill="#ffffff"/>
    <path d="M150 73 a18 18 0 0 1 18 -18 h524 a18 18 0 0 1 18 18 v22 h-560 z" fill="#f1f5fb"/>
    <circle cx="180" cy="84" r="6" fill="#f87171"/>
    <circle cx="202" cy="84" r="6" fill="#fbbf24"/>
    <circle cx="224" cy="84" r="6" fill="#34d399"/>
    <rect x="255" y="76" width="410" height="16" rx="8" fill="#e2e8f0"/>
    <!-- content -->
    <rect x="180" y="115" width="230" height="115" rx="12" fill="url(#blue)"/>
    <rect x="200" y="140" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="200" y="162" width="170" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="200" y="178" width="140" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="200" y="200" width="80" height="18" rx="9" fill="#ffffff"/>
    <rect x="430" y="115" width="115" height="54" rx="10" fill="#eef4ff"/>
    <rect x="560" y="115" width="115" height="54" rx="10" fill="#eef4ff"/>
    <!-- mini bar chart -->
    <rect x="430" y="185" width="245" height="45" rx="10" fill="#f5f8ff"/>
    <rect x="448" y="205" width="14" height="16" rx="3" fill="#93c5fd"/>
    <rect x="470" y="197" width="14" height="24" rx="3" fill="#60a5fa"/>
    <rect x="492" y="189" width="14" height="32" rx="3" fill="#3b82f6"/>
    <rect x="514" y="200" width="14" height="21" rx="3" fill="#818cf8"/>
    <rect x="536" y="193" width="14" height="28" rx="3" fill="#a78bfa"/>
  </g>

  <!-- Phone (responsive) -->
  <g filter="url(#soft)">
    <rect x="770" y="70" width="150" height="205" rx="24" fill="#ffffff"/>
    <rect x="784" y="90" width="122" height="165" rx="12" fill="#eff6ff"/>
    <rect x="828" y="80" width="34" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="784" y="90" width="122" height="46" rx="12" fill="url(#blue)"/>
    <rect x="798" y="150" width="94" height="10" rx="5" fill="#cdddfb"/>
    <rect x="798" y="168" width="70" height="10" rx="5" fill="#dbe7fb"/>
    <rect x="798" y="192" width="94" height="30" rx="8" fill="#e8f0ff"/>
    <rect x="798" y="232" width="60" height="12" rx="6" fill="#3b82f6"/>
  </g>

  <!-- Code badge (dev symbol, drawn as strokes — not text) -->
  <g filter="url(#soft)">
    <rect x="600" y="30" width="86" height="86" rx="20" fill="url(#code)" transform="rotate(-8 643 73)"/>
    <g transform="rotate(-8 643 73)" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="628,55 612,73 628,91"/>
      <polyline points="658,55 674,73 658,91"/>
      <line x1="650" y1="52" x2="636" y2="94"/>
    </g>
  </g>
</svg>
